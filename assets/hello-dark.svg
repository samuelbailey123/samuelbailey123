<svg xmlns="http://www.w3.org/2000/svg" width="640" height="132" viewBox="0 0 640 132" role="img" aria-label="A laptop with code on the screen. Hey, I'm Sam. Husband, photographer, always building something.">
<style>
  .line { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: type 6s steps(8) infinite; }
  .t2 { animation-delay: .8s; } .t3 { animation-delay: 1.6s; } .t4 { animation-delay: 2.4s; }
  @keyframes type { 0% { transform: scaleX(0); } 12%, 85% { transform: scaleX(1); } 100% { transform: scaleX(1); opacity: 0; } }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .line { animation: none; transform: none; } .cursor { animation: none; } }
</style>
<defs>
  <radialGradient id="glow" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#ffe3a3" stop-opacity=".35"/><stop offset="1" stop-color="#ffe3a3" stop-opacity="0"/></radialGradient>
</defs>
<g transform="translate(54 112)">
  <ellipse cx="0" cy="-36" rx="56" ry="44" fill="url(#glow)"/>
  <rect x="-44" y="-70" width="88" height="60" rx="7" fill="#d9d2c6"/>
  <rect x="-38" y="-64" width="76" height="48" rx="3" fill="#2f2a26"/>
  <rect class="line" x="-32" y="-57" width="34" height="5" rx="2.5" fill="#c9a26b"/>
  <rect class="line t2" x="-26" y="-48" width="44" height="5" rx="2.5" fill="#7fa65e"/>
  <rect class="line t3" x="-26" y="-39" width="28" height="5" rx="2.5" fill="#5d7f93"/>
  <rect class="line t4" x="-32" y="-30" width="18" height="5" rx="2.5" fill="#c9a26b"/>
  <rect class="cursor" x="-10" y="-30" width="3" height="6" fill="#f3dcc0"/>
  <path d="M-54 -8 L54 -8 L48 0 L-48 0Z" fill="#c4bcaf"/>
  <rect x="-12" y="-8" width="24" height="3" rx="1.5" fill="#a9a094"/>
</g>
<text x="124" y="80" font-family="ui-rounded,'SF Pro Rounded','Nunito',ui-sans-serif,-apple-system,sans-serif" font-size="50" font-weight="700" fill="#f3dcc0">Hey, I'm Sam.</text>
<text x="126" y="112" font-family="ui-rounded,'SF Pro Rounded','Nunito',ui-sans-serif,-apple-system,sans-serif" font-size="18" fill="#a8927f">husband · photographer · always building something</text>
</svg>
